<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Wars</title>

    <link rel="stylesheet" href="/web/Style/Cascata.css">
</head>
<body>

<div class="login">
    <h1>LEGO WARS</h1>
    <input type="text" placeholder="name"><br>
    <input type="password" placeholder="password"><br>
    <button>Enter</button>
</div>

<div class="form-pedido">
    <h2>NOVO PEDIDO</h2>

    <label>Nome do cliente</label>
    <input type="text" id="inp-cliente" placeholder="Ex: Luke Skywalker">

    <label>Nome do produto</label>
    <input type="text" id="inp-produto" placeholder="Ex: Millennium Falcon">

    <label>Forma de pagamento</label>
    <select id="inp-pagamento">
        <option value="">Selecione...</option>
        <option value="CARTAO">Cartão de crédito</option>
        <option value="PIX">Pix</option>
        <option value="BOLETO">Boleto</option>
    </select>

    <button class="btn-adicionar" onclick="adicionarPedido()">Adicionar pedido</button>
</div>

<div class="lista-pedidos" id="lista">
    <h3>Pedidos realizados</h3>
    <div id="itens"></div>
</div>

<script src="/web/Js/Script.js"></script>

</body>
</html>
